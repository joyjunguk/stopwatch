<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>피자 매장 시사점</title>
  <meta property="og:title" content="피자 매장 시사점 — 30초 모션그래픽" />
  <meta property="og:image" content="poster.jpg" />
  <style>
    :root { --ground: #0c0c0c; --ink: #f3f2ef; --muted: #9a9894; --accent: #ff4a1c; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--ground); color: var(--ink); font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 32px 16px; }
    main { width: 100%; max-width: 1200px; margin: 0 auto; }
    h1 { font-size: clamp(28px, 5vw, 56px); font-weight: 900; letter-spacing: -0.04em; line-height: 1.05; margin-bottom: 20px; }
    h1 span { color: var(--accent); }
    video { width: 100%; aspect-ratio: 16 / 9; display: block; background: #000; }
    p { color: var(--muted); font-size: 14px; margin-top: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>다음 성장은, <span>주문</span>에서.</h1>
    <video src="pizza_insights_30s.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
    <p>피자 프랜차이즈 9개 매장 월별 실적(가상 데이터) 탐색적 분석의 시사점 3가지 · 30초 키네틱 타이포그래피 · 소리를 켜고 재생하세요.</p>
  </main>
</body>
</html>
